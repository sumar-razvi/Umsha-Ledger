<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
<title>UMSHA Ledger</title>
<style>
:root {
  --bg: #faf8f5; --surface: #ffffff; --ink: #1c1b1a; --muted: #6e6a64; --faint: #9a958d; --line: #e7e2da;
  --accent: #6d2b3d; --accent-ink: #ffffff; --accent-soft: #f5eaed;
  --ok: #2f6b4f; --ok-soft: #e8f2ec; --warn: #8a5d0c; --warn-soft: #fbf1dc; --bad: #a3302a; --bad-soft: #fbe9e7;
  --umsha: #6d2b3d; --umsha-bg: #f5eaed; --mirae: #2f5d62; --mirae-bg: #e5efef; --shared: #5d5a55; --shared-bg: #eeebe6;
  --radius: 10px; --gap: 16px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; letter-spacing: .01em; margin: 0 0 12px; }
h1 { font-size: 28px; } h2 { font-size: 21px; } h3 { font-size: 17px; }
a { color: var(--accent); }
.num, .money-cell, td.r, th.r { font-variant-numeric: tabular-nums; text-align: right; }
.muted { color: var(--muted); } .small { font-size: 13px; } .bad-text { color: var(--bad); }
.hidden { display: none !important; }

/* shell */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: rgba(250,248,245,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.brandmark { font-family: var(--serif); font-size: 20px; letter-spacing: .08em; text-transform: uppercase; }
.topbar .spacer { flex: 1; }
.sync { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
.sync.saving { background: var(--warn-soft); color: var(--warn); }
.sync.offline { background: var(--bad-soft); color: var(--bad); }
.who { font-size: 13px; color: var(--muted); text-align: right; line-height: 1.2; }
.layout { display: flex; min-height: calc(100vh - 53px); }
nav.side { width: 210px; flex: none; padding: 18px 10px; border-right: 1px solid var(--line); }
nav.side a, nav.bottom a { display: block; padding: 9px 14px; border-radius: 8px; color: var(--ink); text-decoration: none; }
nav.side a.active { background: var(--accent-soft); color: var(--accent); }
nav.side a:hover { background: #f1ede7; }
main { flex: 1; min-width: 0; padding: 24px 28px 96px; max-width: 1100px; }
nav.bottom { display: none; }
@media (max-width: 768px) {
  nav.side { display: none; }
  nav.bottom { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); overflow-x: auto; }
  nav.bottom a { flex: 1 0 auto; text-align: center; font-size: 13px; padding: 10px 8px; }
  nav.bottom a.active { color: var(--accent); font-weight: 600; }
  main { padding: 16px 14px 110px; }
  .topbar { padding: 10px 14px; }
  .who .email, .topbar .date, .who .name { display: none; }
  .topbar { gap: 8px; }
  .topbar .signout { min-height: 36px; padding: 6px 8px; }
  .brandmark { font-size: 17px; }
}

/* building blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: var(--gap); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1 1 180px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
@media (max-width: 768px) { .grid2 { grid-template-columns: 1fr; } }
.pagehead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.pagehead h1 { margin: 0; flex: 1; }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
input, select, textarea { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-height: 44px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
textarea { min-height: 70px; }
.hint { font-size: 12px; color: var(--muted); min-height: 16px; margin-top: 2px; }
.hint.bad { color: var(--bad); }
button, .btn { font: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.ghost { background: transparent; border-color: transparent; color: var(--accent); }
button.danger { color: var(--bad); border-color: #e8c9c5; }
button:disabled { opacity: .55; cursor: default; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill.UMSHA { background: var(--umsha-bg); color: var(--umsha); } .pill.MIRAE { background: var(--mirae-bg); color: var(--mirae); } .pill.SHARED { background: var(--shared-bg); color: var(--shared); }
.status { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--shared-bg); color: var(--shared); white-space: nowrap; }
.status.OPEN, .status.IN_PRODUCTION { background: #eef0f6; color: #3c4a74; } .status.READY { background: var(--warn-soft); color: var(--warn); }
.status.DELIVERED, .status.POSTED, .status.COMPLETED { background: var(--ok-soft); color: var(--ok); } .status.CANCELLED, .status.VOID { background: var(--bad-soft); color: var(--bad); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { min-height: 36px; padding: 6px 14px; border-radius: 99px; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

table.data { width: 100%; border-collapse: collapse; }
table.data th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.data td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data tr.click { cursor: pointer; } table.data tr.click:hover td { background: #faf6f1; }
table.data tr.overdue td { background: var(--bad-soft); }
table.data tfoot td { font-weight: 600; border-bottom: none; }
.tablewrap { overflow-x: auto; }
@media (max-width: 768px) { table.data .opt { display: none; } }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; }
.kv .v { text-align: right; font-variant-numeric: tabular-nums; }
.kv .total { font-weight: 600; border-top: 1px solid var(--line); padding-top: 6px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--gap); margin-bottom: var(--gap); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.tile .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tile .value { font-family: var(--serif); font-size: 26px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--shared-bg); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.timeline li .when { width: 92px; flex: none; color: var(--muted); font-size: 13px; }
.timeline li .what { flex: 1; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.notice { padding: 12px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); margin-bottom: 12px; }
.notice.bad { background: var(--bad-soft); color: var(--bad); } .notice.ok { background: var(--ok-soft); color: var(--ok); }
.lineedit { display: grid; grid-template-columns: 2fr 70px 1fr 1fr 44px; gap: 8px; align-items: start; margin-bottom: 8px; }
@media (max-width: 768px) {
  .lineedit { grid-template-columns: 70px 1fr 1fr 40px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
  .lineedit .desc { grid-column: 1 / -1; } .lineedit.head { display: none; }
}

/* picker */
.picker { position: relative; }
.picker .results { position: absolute; z-index: 30; left: 0; right: 0; top: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.08); max-height: 280px; overflow-y: auto; }
.picker .results button { display: flex; justify-content: space-between; width: 100%; border: 0; border-radius: 0; border-bottom: 1px solid var(--line); text-align: left; }
.picker .chosen { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--accent-soft); min-height: 44px; }

/* sheet */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(28,27,26,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
.sheet { background: var(--bg); border-radius: 14px; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
@media (max-width: 768px) { .overlay { align-items: flex-end; padding: 0; } .sheet { border-radius: 14px 14px 0 0; max-height: 94vh; padding-bottom: calc(20px + env(safe-area-inset-bottom)); } }

/* toasts */
#toasts { position: fixed; z-index: 50; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
.toast { background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.toast.bad { background: var(--bad); }
@media (max-width: 768px) { #toasts { left: 12px; right: 12px; bottom: 80px; max-width: none; } }

/* login */
.login { max-width: 420px; margin: 12vh auto; text-align: center; padding: 0 20px; }
.login .brandmark { font-size: 34px; margin-bottom: 4px; }
.login .gsi { display: flex; justify-content: center; margin: 24px 0; min-height: 44px; }

/* printable documents */
.doc { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; max-width: 680px; }
.doc .dochead { display: flex; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 14px; }
.doc .co { font-family: var(--serif); font-size: 24px; letter-spacing: .08em; text-transform: uppercase; }
.doc.thermal { max-width: 80mm; padding: 10px; font-size: 12px; }
.doc.thermal .dochead { flex-direction: column; }
@media print {
  .topbar, nav, .noprint, #toasts { display: none !important; }
  main { padding: 0; max-width: none; } .layout { display: block; }
  body { background: #fff; } .doc { border: 0; padding: 0; max-width: none; }
  .doc.thermal { width: 80mm; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script src="core.bundle.js"></script>
<script>
// CONFIG: deployment settings (README-deploy.md). Not secrets: the Sheet ID
// lives in Apps Script Script Properties and every request is checked there.
const CONFIG = {
  API_URL: '',          // Apps Script web app URL ending in /exec
  OAUTH_CLIENT_ID: '',  // Google Identity Services client ID
  DEV_SIGNIN: false,    // true only on the local demo server (npm run serve)
};
</script>
<script>
(function () {
  'use strict';
  // Core.gs namespaces (core.bundle.js): Money, Ids, Validate, Inventory, Dates, Csv, Receipts, Permissions, ...

  // ---------- small helpers ----------
  const $app = document.getElementById('app');
  const state = { me: null, token: null, accounts: [], accountsByCode: {}, settings: {}, taxCodes: [] };

  function h(tag, props) {
    const el = document.createElement(tag);
    const p = props || {};
    Object.keys(p).forEach((k) => {
      const v = p[k];
      if (v === undefined || v === null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.setAttribute('style', v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k in el && k !== 'list') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (let i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach((k) => add(el, k)); return; }
    el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
  const rs = (paisa, opts) => (paisa === null || paisa === undefined || paisa === '' ? '' :
    Money.formatPaisa(paisa, Object.assign({ grouping: state.settings.currencyGrouping }, opts || {})));
  const rsTable = (paisa) => rs(paisa, { decimals: 'ALWAYS', symbol: '' });
  const pct = (bps) => (bps === null || bps === undefined ? 'n/a' : (bps / 100).toFixed(1) + '%');
  const today = () => Dates.karachiDate();
  const fmtDate = (iso) => {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00Z');
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  };
  const STATUS_LABEL = { OPEN: 'Booked', IN_PRODUCTION: 'In production', READY: 'Ready', DELIVERED: 'Delivered', CANCELLED: 'Cancelled', COMPLETED: 'Completed', POSTED: 'Posted', VOID: 'Reversed' };
  const COMPONENT_LABEL = { FABRIC: 'Fabric', TRIMS: 'Trims & embellishments', EMBROIDERY: 'Embroidery (karigar)', STITCHING: 'Stitching & tailoring', OUTSOURCED: 'Dyeing & outsourced', PACKAGING: 'Packaging', OTHER: 'Other' };
  const DOC_LABEL = { PAYMENT: 'Money received', BILL: 'Karigar / supplier bill', INVOICE: 'Delivery invoice', STOCK_ISSUE: 'Materials issued', STOCK_RETURN: 'Materials returned', JOB_CANCELLATION: 'Cancelled', BATCH_COMPLETION: 'Batch completed', MANUAL: 'Manual journal', SALE: 'Sale', EXPENSE: 'Expense' };
  function statusPill(s) { return h('span', { class: 'status ' + s }, STATUS_LABEL[s] || s); }
  function brandPill(b) { return h('span', { class: 'pill ' + b }, b === 'MIRAE' ? 'Mirae' : b === 'UMSHA' ? 'UMSHA' : 'Shared'); }
  function can(action, payload) {
    try { return Permissions.check(state.me, action, payload || {}, { accountsByCode: state.accountsByCode }); } catch (e) { return false; }
  }

  // ---------- toasts ----------
  function toast(message, kind) {
    const t = h('div', { class: 'toast' + (kind === 'bad' ? ' bad' : ''), role: 'status' }, message);
    document.getElementById('toasts').appendChild(t);
    setTimeout(() => t.remove(), kind === 'bad' ? 7000 : 3500);
  }

  // ---------- sign-in ----------
  const TOKEN_KEY = 'umsha.idToken';
  function tokenExp(token) {
    try { return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch (e) { return null; }
  }
  function tokenValid(token) {
    if (!token) return false;
    const exp = tokenExp(token);
    return exp === null || exp - 60000 > Date.now();
  }
  function setToken(token) {
    state.token = token;
    try { sessionStorage.setItem(TOKEN_KEY, token); } catch (e) { /* private mode */ }
  }
  function signOut() {
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* ignore */ }
    state.token = null; state.me = null;
    if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
    location.hash = '#/';
    boot();
  }
  function loadGsi() {
    return new Promise((resolve, reject) => {
      if (window.google && google.accounts && google.accounts.id) return resolve();
      const s = h('script', { src: 'https://accounts.google.com/gsi/client', async: true, defer: true });
      s.onload = resolve; s.onerror = () => reject(new Error('Could not load Google sign-in'));
      document.head.appendChild(s);
    });
  }

  // ---------- API and the offline queue ----------
  // Writes get a requestId once and keep it through every retry (the server
  // returns the stored result for a repeated requestId, so nothing posts twice).
  const QUEUE_KEY = 'umsha.queue.v1';
  const queue = {
    items: (() => { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { return []; } })(),
    inflight: 0,
    lastOk: true,
    save() { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(this.items)); } catch (e) { /* storage full or blocked */ } },
    put(item) { this.items.push(item); this.save(); syncIndicator(); },
    drop(item) { this.items = this.items.filter((x) => x.requestId !== item.requestId); this.save(); syncIndicator(); },
  };
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  }
  class NetworkError extends Error {}
  async function transmit(req) {
    if (!CONFIG.API_URL) throw Object.assign(new Error('The app is not connected to a server yet (CONFIG.API_URL).'), { code: 'E_CONFIG' });
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 30000);
    let res;
    try {
      res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), signal: ctrl.signal });
    } catch (e) {
      throw new NetworkError('No connection');
    } finally {
      clearTimeout(timer);
    }
    if (!res.ok) throw new NetworkError('Server unavailable (' + res.status + ')');
    try { return await res.json(); } catch (e) { throw new NetworkError('Unexpected response'); }
  }
  function apiError(res) { return Object.assign(new Error(res.message || 'Something went wrong'), { code: res.code, field: res.field }); }

  // Reads: one attempt, errors thrown to the screen.
  async function api(action, payload) {
    const res = await transmit({ action, idToken: state.token, payload: payload || {} });
    if (!res.ok) {
      if (res.code === 'E_AUTH') needSignIn();
      throw apiError(res);
    }
    return res.data;
  }

  // Writes: queued first, then sent. If the network fails the write stays on
  // this phone and is retried automatically; the caller learns it is QUEUED.
  async function save(action, payload, label) {
    const item = { requestId: uuid(), action, payload: payload || {}, label: label || action, tries: 0, next: 0, at: Date.now() };
    queue.put(item);
    return sendItem(item, true);
  }
  async function sendItem(item, interactive) {
    queue.inflight++; syncIndicator();
    try {
      const res = await transmit({ action: item.action, idToken: state.token, requestId: item.requestId, payload: item.payload });
      if (res.ok) { queue.drop(item); queue.lastOk = true; return res.data; }
      if (res.code === 'E_BUSY') throw new NetworkError('Busy');
      if (res.code === 'E_AUTH') { needSignIn(); throw Object.assign(apiError(res), { keep: true }); }
      queue.drop(item);
      if (!interactive) toast('Could not save "' + item.label + '": ' + res.message, 'bad');
      throw apiError(res);
    } catch (e) {
      if (e instanceof NetworkError || e.keep) {
        queue.lastOk = false;
        item.tries++; item.next = Date.now() + Math.min(60000, 2000 * Math.pow(2, item.tries - 1));
        queue.save();
        if (interactive) throw Object.assign(new Error('No connection. This is saved on your phone and will be sent automatically.'), { code: 'QUEUED' });
        return null;
      }
      throw e;
    } finally {
      queue.inflight--; syncIndicator();
    }
  }
  async function flushQueue() {
    if (!state.token || queue.inflight) return;
    for (const item of queue.items.slice()) {
      if (item.next > Date.now()) continue;
      try {
        const data = await sendItem(item, false);
        if (data) toast('Saved: ' + item.label);
      } catch (e) { /* reported by sendItem */ }
    }
  }
  setInterval(flushQueue, 5000);
  window.addEventListener('online', () => { queue.items.forEach((i) => { i.next = 0; }); flushQueue(); });

  function syncIndicator() {
    const el = document.getElementById('sync');
    if (!el) return;
    const n = queue.items.length;
    el.className = 'sync' + (queue.inflight ? ' saving' : n ? ' offline' : '');
    el.textContent = queue.inflight ? 'Saving…' : n ? 'Offline: ' + n + ' pending' : 'Saved';
  }

  // ---------- shared components ----------
  // A labelled form row. Plain inputs sit inside a <label>; composite controls
  // (pickers, money fields with hints) use a <div>, because a <label> forwards
  // clicks to its first control, which breaks controls that re-render.
  function field(label, control, hint) {
    const simple = ['INPUT', 'SELECT', 'TEXTAREA'].includes(control.tagName);
    if (!simple && control.input && !control.input.getAttribute('aria-label')) control.input.setAttribute('aria-label', label);
    return h(simple ? 'label' : 'div', { class: 'field' }, h('span', {}, label), control, hint ? h('div', { class: 'hint' }, hint) : null);
  }

  // Rupee input: accepts 125000, 1,25,000, 125k, 1.25L; shows Rs 125,000.
  function moneyInput(opts) {
    const o = opts || {};
    let paisa = o.value === undefined || o.value === null ? null : o.value;
    const input = h('input', { type: 'text', inputMode: 'decimal', autocomplete: 'off', placeholder: o.placeholder || 'e.g. 125000 or 1.25L', value: paisa === null ? '' : rs(paisa), 'aria-label': o.label || 'Amount' });
    const hint = h('div', { class: 'hint' });
    const wrap = h('div', { class: 'money-field' }, input, hint);
    function parse() {
      const t = input.value.trim();
      if (!t) { paisa = null; hint.textContent = ''; hint.classList.remove('bad'); }
      else {
        try { paisa = Money.parseRupees(t); hint.textContent = rs(paisa); hint.classList.remove('bad'); }
        catch (e) { paisa = undefined; hint.textContent = 'Type an amount like 125000, 125k or 1.25L'; hint.classList.add('bad'); }
      }
      if (o.onChange) o.onChange(paisa);
    }
    input.addEventListener('input', parse);
    input.addEventListener('blur', () => { if (typeof paisa === 'number') { input.value = rs(paisa); hint.textContent = ''; } });

  route('/orders/:id/deliver', async (view, [id]) => {
    const d = await api('jobs.get', { id });
    const j = d.job;
    view.appendChild(h('div', { class: 'pagehead' }, h('h1', {}, 'Deliver ' + j.id), h('a', { class: 'btn', href: '#/orders/' + j.id }, 'Back')));
    const box = h('div');
    const date = h('input', { type: 'date', value: today() });
    const extra = quoteLinesEditor(update);
    const preview = h('div', { class: 'kv' });
    function update() {
      const net = linesNet(d.lines) + linesNet(extra.safeValues());
      const tax = Money.applyBps(net, d.taxRateBps || 0);
      const gross = net + tax;
      const applied = Math.max(0, Math.min(d.advanceHeldPaisa, gross));
      const cost = d.costSheet.totalPaisa;
      clear(preview).append(
        h('span', {}, 'Invoice before tax'), h('span', { class: 'v' }, rs(net)),
        h('span', {}, 'Sales tax'), h('span', { class: 'v' }, rs(tax)),
        h('span', { class: 'total' }, 'Invoice total'), h('span', { class: 'v total' }, rs(gross)),
        h('span', {}, 'Advances applied'), h('span', { class: 'v' }, '− ' + rs(applied)),
        h('span', { class: 'total' }, 'Balance due on delivery'), h('span', { class: 'v total' }, rs(gross - applied)),
        h('span', {}, 'Cost of the order'), h('span', { class: 'v' }, rs(cost)),
        h('span', {}, 'Margin'), h('span', { class: 'v' }, rs(net - cost) + ' (' + (net ? pct(Math.round((net - cost) * 10000 / net)) : 'n/a') + ')'));
      if (d.advanceHeldPaisa > gross) preview.append(h('span', { class: 'bad-text' }, 'Advance more than invoice: refund due'), h('span', { class: 'v bad-text' }, rs(d.advanceHeldPaisa - gross)));
    }
    update();
    const confirm = h('button', { type: 'button', class: 'primary' }, 'Confirm delivery');
    view.appendChild(h('div', { class: 'grid2' },
      h('div', { class: 'card' }, h('h2', {}, 'Invoice'), dataTable([{ key: 'description', label: 'Piece' }, { key: 'qty', label: 'Qty', num: true },
        { key: 'n', label: 'Amount', num: true, render: (l) => rsTable(Inventory.qtyTimesPaisa(l.qty, l.unitPricePaisa) - (l.discountPaisa || 0)) }], d.lines),
      h('h3', { style: 'margin-top:16px' }, 'Anything else on the invoice?'), extra),
      h('div', { class: 'card' }, box, field('Delivery date', date), preview, h('div', { class: 'actions', style: 'margin-top:16px' }, confirm))));
    confirm.addEventListener('click', async () => {
      try {
        const r = await submitting(confirm, box, () => save('jobs.deliver', { jobId: j.id, date: date.value, extraLines: extra.values() }, 'Deliver ' + j.id));
        if (!r) return;
        toast('Delivered. Invoice ' + r.invoice.id);
        if (r.invoice.balancePaisa > 0 && can('payments.receive')) {
          go('#/receipts/INVOICE/' + r.invoice.id);
          setTimeout(() => balanceSheet(d, Object.assign({}, r.invoice, { contactId: j.contactId })), 300);
        } else go('#/receipts/INVOICE/' + r.invoice.id);
      } catch (e) { /* shown */ }
    });
  });

  async function fileToUpload(file) {
    if (!file) return null;
    if (file.type === 'application/pdf') return { mimeType: file.type, fileName: file.name, dataBase64: await blobToBase64(file) };
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const canvas = h('canvas', { width: Math.round(bmp.width * scale), height: Math.round(bmp.height * scale) });
    canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.8));
    return { mimeType: 'image/jpeg', fileName: file.name.replace(/\.\w+$/, '') + '.jpg', dataBase64: await blobToBase64(blob) };
  }

  // Same split as the server (R10): C x q x w / Σ(q x w), exact, residual on the last line.
  function batchSplit(total, outputs) {
    const weights = outputs.map((o) => Money.parseDecimal(o.weight || 1, 6, 'weight'));
    const maxPlaces = weights.reduce((m, w) => Math.max(m, w.places), 0);
    const products = outputs.map((o, i) => BigInt(Inventory.toMilli(o.qty || 0)) * weights[i].units * 10n ** BigInt(maxPlaces - weights[i].places));
    if (!products.some((p) => p > 0n)) return outputs.map(() => 0);
    return Money.splitProRata(total, products);
  }

  }

  // ---------- modules not built yet ----------
  const SOON = { store: ['Store', 'M6'], sale: ['New sale', 'M6'], returns: ['Returns', 'M6'], today: ['Today', 'M6'], cashup: ['Cash-up', 'M6'], banking: ['Banking', 'M8'], reports: ['Reports', 'M7'] };
  route('/soon/:what', async (view, [what]) => {
    const s = SOON[what] || [what, 'a later milestone'];
    view.appendChild(h('h1', {}, s[0]));
    view.appendChild(h('div', { class: 'card empty' }, s[0] + ' arrives in milestone ' + s[1] + '.'));
  });

  // ---------- sign-in screen and boot ----------
  let signInShown = false;
  function needSignIn() {
    if (signInShown) return;
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* ignore */ }
    state.token = null;
    showLogin('Please sign in again to continue.');
  }
  async function showLogin(message) {
    signInShown = true;
    clear($app);
    const box = h('div', { class: 'gsi' });
    const note = h('p', { class: 'muted small' }, message || 'Sign in with the Google account the Owner added for you.');
    $app.appendChild(h('div', { class: 'login' }, h('div', { class: 'brandmark' }, 'UMSHA'), h('div', { class: 'muted' }, 'Ledger'), box, note));
    if (CONFIG.DEV_SIGNIN) {
      const users = await (await fetch('/dev/users')).json();
      users.forEach((u) => box.appendChild(h('button', { type: 'button', style: 'margin:4px', onclick: async () => {
        const t = await (await fetch('/dev/token?email=' + encodeURIComponent(u.email))).json();
        setToken(t.token); signInShown = false; boot();
      } }, u.name + ' (' + Permissions.ROLE_LABEL[u.role] + ')')));
      box.style.flexWrap = 'wrap';
      note.textContent = 'Demo server: pick anyone. Data lives in memory and resets when the server stops.';
      return;
    }
    if (!CONFIG.API_URL || !CONFIG.OAUTH_CLIENT_ID) {
      note.textContent = 'This copy of the app is not connected yet. Set API_URL and OAUTH_CLIENT_ID in the CONFIG block of index.html (see README-deploy.md).';
      return;
    }
    try {
      await loadGsi();
      google.accounts.id.initialize({ client_id: CONFIG.OAUTH_CLIENT_ID, auto_select: true, callback: (resp) => { setToken(resp.credential); signInShown = false; boot(); } });
      google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with' });
      google.accounts.id.prompt();
    } catch (e) {
      note.textContent = 'Could not load Google sign-in. Check your connection and reload.';
    }
  }

  async function boot() {
    let token = null;
    try { token = sessionStorage.getItem(TOKEN_KEY); } catch (e) { /* ignore */ }
    if (!tokenValid(token)) { showLogin(); return; }
    state.token = token;
    clear($app).appendChild(h('div', { class: 'login muted' }, 'Loading…'));
    try {
      const me = await api('session.me', {});
      state.me = me;
      state.settings = me.settings || {};
      state.accounts = me.accounts || [];
      state.accountsByCode = {};
      state.accounts.forEach((a) => { state.accountsByCode[a.code] = a; });
      state.taxCodes = me.taxCodes || [];
      signInShown = false;
      render();
      flushQueue();
    } catch (e) {
      if (e.code === 'E_AUTH') return;
      clear($app).appendChild(h('div', { class: 'login' }, h('div', { class: 'brandmark' }, 'UMSHA'),
        h('div', { class: 'notice bad', style: 'margin-top:20px' }, e.message || 'Could not reach the server.'),
        h('button', { type: 'button', onclick: boot }, 'Try again')));
    }
  }
  boot();
})();
</script>
</body>
</html>
